<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>حافظ</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1B2A6B"><link rel="apple-touch-icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Readex+Pro:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6EAF1;--cd:#F4F6FA;--tx:#141A38;--mu:#566083;--pr:#1B2A6B;--pt:#F6F2E6;--ac:#94600F;--bad:#B0372E;--ok:#1E7A55;--bd:#C6CEDF;--pp:#FBF8EE;--tn:#DCE2EE;--fr:color-mix(in srgb,var(--ac) 50%,transparent)}
@media(prefers-color-scheme:dark){:root{--bg:#0B0F22;--cd:#131937;--tx:#E9EBF5;--mu:#9AA3C6;--pr:#A9B8F7;--pt:#0B0F22;--ac:#E6B864;--bad:#F2877D;--ok:#62D3A0;--bd:#252D58;--pp:#0F1530;--tn:#1C2347}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.8 "Readex Pro",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:calc(14px + env(safe-area-inset-top)) 0 calc(96px + env(safe-area-inset-bottom))}
#v{max-width:560px;margin:auto}
h1{font:700 2rem/1.25 "Reem Kufi","Readex Pro",sans-serif}h3{font:600 1.1rem/1.5 "Reem Kufi","Readex Pro",sans-serif;margin-bottom:6px}
small,p{color:var(--mu)}small{font-size:.82rem}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:18px;margin:12px 14px}
.w{border-inline-start:4px solid var(--bad)}
.ar{position:relative;font:1.85rem/2.75 "Amiri Quran","Scheherazade New",serif;text-align:center;color:var(--tx);text-wrap:balance;word-spacing:.12em;
background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--ac) 11%,var(--pp)),var(--pp) 70%);border-radius:16px;padding:30px 20px 24px;margin:22px 0 14px;
box-shadow:inset 0 0 0 1px var(--fr),inset 0 0 0 6px var(--pp),inset 0 0 0 7px var(--bd),0 10px 24px -14px rgba(0,0,0,.45)}
.ar::before{content:"✦";position:absolute;top:0;left:50%;transform:translate(-50%,-52%);background:var(--cd);color:var(--ac);font:500 .8rem/1.6 "Reem Kufi","Readex Pro",sans-serif;padding:0 12px;letter-spacing:.04em;white-space:nowrap}
.ar[data-s]::before{content:"✦  " attr(data-s) "  ✦";font-size:.9rem}
.ar[data-n]::after{content:attr(data-n);display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;padding:0 .2em;margin-inline-start:.55em;vertical-align:.12em;
border:1.5px solid var(--ac);border-radius:50%;color:var(--ac);font:400 .58em/1 "Amiri Quran",serif;box-shadow:0 0 0 3px var(--pp),0 0 0 4px var(--fr)}
.ar.big{font-size:2.1rem;line-height:2.9;padding:34px 18px 28px}
.ar:empty{display:none}
.q{color:var(--tx);font-weight:600}.q .ar{display:block}
.q .ar{margin:6px 0}.sm .ar{margin:20px 0 6px;font-size:1.4rem;line-height:2.3;padding:22px 14px 16px}.q .ar::before,.sm .ar::before{display:none}
button{font:inherit;font-weight:500;border-radius:12px;padding:12px 18px;border:1.5px solid var(--pr);margin-top:10px;cursor:pointer;transition:transform .12s,opacity .2s}
button:active{transform:scale(.97)}.b{background:var(--pr);color:var(--pt)}.g{background:transparent;color:var(--pr)}button:disabled{opacity:.35}
button[data-r="2"]{background:var(--ok);border-color:var(--ok);color:var(--pt)}
button[data-r="1"]{color:var(--ac);border-color:var(--ac)}
button[data-r="0"]{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.c>button{width:100%}.r{display:flex;gap:8px}.r button{flex:1}
.x div{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}.x button{padding:5px 12px;margin:0;font-size:.85rem;border-radius:8px}
.tm{font:700 3rem/1.3 "Reem Kufi",sans-serif;text-align:center;color:var(--ac);font-variant-numeric:tabular-nums}
label{display:block;margin-top:14px;font-weight:500}
input,select{font:inherit;width:100%;padding:11px 12px;margin-top:4px;border-radius:12px;border:1.5px solid var(--bd);background:var(--tn);color:var(--tx)}
input:focus,select:focus{border-color:var(--pr);outline:0}
input[type=checkbox]{width:auto;margin-inline-end:8px}
audio{width:100%;margin-top:8px}
/*WORD*/.ar span{transition:background .15s,color .15s}.ar span.on{background:var(--ac);color:var(--pt);border-radius:8px;padding:0 6px;margin:0 -6px;box-shadow:0 2px 10px -2px var(--ac)}
mark{background:var(--ac);color:var(--pt);border-radius:4px;padding:0 3px}
.sm{border-top:1px solid var(--bd);margin-top:10px;padding-top:8px}
.mp{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:12px;direction:ltr}
.mp i{aspect-ratio:1;background:var(--tn);border-radius:2.5px}.mp .m1{background:var(--ok)}.mp .m2{background:var(--ac)}
.bars{display:flex;gap:6px;margin-top:10px}.bars>div{flex:1;text-align:center}
.bc{height:96px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--bd)}.bc i{flex:1;border-radius:4px 4px 0 0;min-height:3px}
.pg{margin:8px 0;min-height:200px}.pg img{width:100%;display:block;border-radius:6px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 20px 0}.hd small{display:block}
.chip{display:flex;align-items:center;gap:6px;background:var(--cd);border:1px solid var(--bd);border-radius:999px;padding:4px 14px 4px 12px;font-weight:700;color:var(--ac)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hero{position:relative;width:224px;height:224px;margin:28px auto 14px}
.hero::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px dashed var(--bd)}
.hero .rg{width:100%;height:100%;transform:rotate(-90deg);stroke-width:6}
.rg circle{stroke-linecap:round}.rg circle:first-child{stroke:var(--tn)}.rg circle:last-child{stroke:var(--ac)}
.hn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.4}
.hn b{font:400 3.6rem/1.2 "Amiri Quran",serif;color:var(--tx)}
.lst{margin:26px 14px 0}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:right;background:transparent;color:var(--tx);border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:16px 4px;margin:0}
.row:last-child{border-bottom:0}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tn);color:var(--pr);flex:none}
.tt{flex:1;display:flex;flex-direction:column;line-height:1.5}.tt b{font-weight:600}.row>svg{color:var(--mu);width:18px}
.row.pri{background:var(--pr);color:var(--pt);border:0;border-radius:16px;padding:18px;margin-bottom:8px}
.row.pri small,.row.pri>svg{color:var(--pt);opacity:.8}.row.pri .ic{background:color-mix(in srgb,var(--pt) 16%,transparent);color:var(--pt)}
nav{position:fixed;inset:auto 0 0;max-width:560px;margin:auto;display:flex;background:var(--cd);border:1px solid var(--bd);border-bottom:0;border-radius:20px 20px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;border-radius:12px;margin:0;padding:6px 0;background:none;color:var(--mu);font-size:.68rem}
nav button.on{color:var(--pr)}
nav button.on::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--ac);margin-top:2px}

/*LEARN-UI*/
.ls{display:flex;flex-direction:column;min-height:calc(100dvh - 130px)}
.lt{display:flex;align-items:center;gap:12px;padding:4px 16px 0}
.ib{width:40px;height:40px;padding:0;margin:0;border-radius:50%;border:1px solid var(--bd);background:var(--cd);color:var(--mu);display:grid;place-items:center;flex:none}
.sg{flex:1;display:flex;gap:4px}.sg i{flex:1;height:5px;border-radius:3px;background:var(--tn);transition:background .3s}.sg i.d{background:var(--ac)}.sg i.on{background:var(--pr)}
.ttl{text-align:center;font:600 1rem/1.5 "Reem Kufi","Readex Pro",sans-serif;margin:12px 16px 0}
.stp{display:flex;justify-content:center;gap:6px;margin:8px 16px 0;flex-wrap:wrap}
.stp span{font-size:.74rem;padding:2px 11px;border-radius:999px;background:var(--tn);color:var(--mu)}.stp span.on{background:var(--pr);color:var(--pt);font-weight:600}
.lb{flex:1;padding:8px 16px 0}
.lb .hint{text-align:center;font-size:.88rem;margin:12px 0 0}
.lb .q{text-align:center;font-size:1.05rem;margin-top:14px}
.ar.prev{opacity:.7;font-size:1.4rem;line-height:2.3}
.dock{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;padding:10px;margin:16px 14px 0;background:color-mix(in srgb,var(--cd) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:24px;box-shadow:0 14px 30px -18px rgba(0,0,0,.55)}
.dock button{margin:0}.dock .go{flex:1;padding:15px;font-size:1.05rem;border-radius:16px}.dock.rt button,.dock>.g{flex:1;padding:14px 8px;border-radius:16px}
.dock .rb{flex:none;width:54px;height:54px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--tn);color:var(--pr);border:0}.dock .rb svg{fill:currentColor;width:22px;height:22px}
.tools{display:flex;justify-content:center;gap:8px;margin-top:10px}.tools button{margin:0;padding:7px 16px;font-size:.85rem;border-radius:999px;border-color:var(--bd);color:var(--mu)}
.cnt{display:flex;justify-content:center;gap:12px;margin:14px 0 0;padding:16px;border-radius:18px;border:1.5px dashed var(--bd);cursor:pointer}
.cnt i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ac);transition:background .2s,transform .2s}.cnt i.f{background:var(--ac);transform:scale(1.12)}
.cnt.done{border:1.5px solid var(--ok)}.cnt.done i{border-color:var(--ok);background:var(--ok)}
.tm{width:92px;height:92px;margin:14px auto 6px;border-radius:50%;display:grid;place-items:center;font:700 2rem/1 "Reem Kufi",sans-serif;isolation:isolate;background:conic-gradient(var(--ac) calc(var(--p,100)*1%),var(--tn) 0)}
.tm::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg);z-index:-1}.tm{position:relative}
.fin{text-align:center;padding:34px 20px}.fin .bd{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:var(--ok);color:var(--pt);display:grid;place-items:center}.fin .bd svg{width:36px;height:36px;stroke-width:2.4}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id=v></div>
<nav><button onclick=home()><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>اليوم</button><button onclick=mushaf()><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M9 7h6"/></svg>المصحف</button><button onclick=map()><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>الخريطة</button><button onclick=stats()><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>إحصاءات</button><button onclick=rnd()><svg viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></svg>اختبار</button><button onclick=more()><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"/></svg>المزيد</button></nav>
<script>
const $=s=>document.querySelector(s),DAY=864e5,now=Date.now,STEPS=[1,3,7,14,21],RC={'ar.alafasy':'مشاري العفاسي','ar.husary':'الحصري','ar.minshawi':'المنشاوي','ar.abdulbasitmurattal':'عبد الباسط (مرتل)'};
let IV,au=new Audio(),D,T,S=JSON.parse(localStorage.hifz||'null')||{w:5,cur:0,dir:1,u:[],hist:[],day:{},rec:'ar.alafasy'};
const save=()=>localStorage.hifz=JSON.stringify(S),H=(h,k)=>{clearInterval(IV);k||(PT++,au.pause());$('#v').innerHTML=h;k||scrollTo(0,0)};
const idb=(k,v)=>new Promise((res,rej)=>{const r=indexedDB.open('hifz',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>{const t=r.result.transaction('k',v===undefined?'readonly':'readwrite'),q=v===undefined?t.objectStore('k').get(k):t.objectStore('k').put(v,k);t.oncomplete=()=>res(q.result);t.onerror=rej};r.onerror=rej});
const nm=i=>D.s[D.a[i][0]],ref=i=>nm(i)+' '+D.a[i][1],tx=i=>D.a[i][3],EV={'ar.alafasy':'Alafasy_128kbps','ar.husary':'Husary_128kbps','ar.minshawi':'Minshawy_Murattal_128kbps','ar.abdulbasitmurattal':'Abdul_Basit_Murattal_192kbps'},
p3=n=>String(n).padStart(3,'0'),
auds=i=>[`https://cdn.islamic.network/quran/audio/128/${S.rec}/${i+1}.mp3`,`https://everyayah.com/data/${EV[S.rec]}/${p3(D.a[i][0]+1)}${p3(D.a[i][1])}.mp3`,`https://cdn.islamic.network/quran/audio/64/${S.rec}/${i+1}.mp3`],aud=i=>auds(i)[0];
const rng=(a,b)=>Array.from({length:b-a+1},(_,k)=>a+k),se=i=>{while(D.a[i+1]&&D.a[i+1][0]==D.a[i][0])i++;return i},dk=t=>new Date((t||now())-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const streak=()=>{let n=0,t=now();if(!S.day[dk(t)])t-=DAY;while(S.day[dk(t)]){n++;t-=DAY}return n};
const nextPortion=()=>{const a=S.cur;return[a,Math.min(a+S.w-1,se(a))]};
const adv=b=>{const s=D.a[b][0];S.cur=D.a[b+1]&&D.a[b+1][0]==s?b+1:D.a.findIndex(x=>x[0]==(s+S.dir+114)%114)};

async function load(){D=await idb('q');if(!D){H(`<div class=c><h3>تحميل المصحف</h3><p>مرة واحدة فقط (رواية حفص من alquran.cloud). بعدها النص يشتغل بدون إنترنت.</p><p id=pg></p><button class=b onclick=dl()>ابدأ التحميل</button></div>`);return}S.init?home():more()}
async function dl(){$('#pg').textContent='جارٍ التحميل…';try{const j=await(await fetch('https://api.alquran.cloud/v1/quran/quran-uthmani')).json(),a=[],s=[];for(const z of j.data.surahs){s.push(z.name.split(' ').slice(1).join(' '));for(const y of z.ayahs){let t=y.text.trim();if(y.numberInSurah==1&&z.number!=1&&z.number!=9)t=t.split(/\s+/).slice(4).join(' ');a.push([z.number-1,y.numberInSurah,y.page,t])}}D={s,a};await idb('q',D);more()}catch(e){$('#pg').textContent='فشل التحميل. اتأكد من الإنترنت وجرّب تاني.'}}

function home(){const t=now(),due=S.u.filter(u=>u.d<=t).sort((x,y)=>x.d-y.d),[a,b]=nextPortion(),bad=S.hist.slice(-10).filter(r=>r==0).length>=3||due.length>=8,mem=S.u.reduce((n,u)=>n+u.b-u.a+1,0),pgs=new Set();S.u.forEach(u=>rng(u.a,u.b).forEach(i=>pgs.add(D.a[i][2])));const C=2*Math.PI*100,ar=n=>n.toLocaleString('ar-EG');
H(`<div class=hd><div><small>السلام عليكم</small><h1>وردك اليوم</h1></div><div class=chip><svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>${ar(streak())}</div></div>
<div class=hero><svg class=rg viewBox="0 0 224 224"><circle cx=112 cy=112 r=100 fill=none stroke="var(--tn)"/><circle cx=112 cy=112 r=100 fill=none stroke="var(--pr)" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pgs.size/604)}"/></svg><div class=hn><b>${ar(pgs.size)}</b><small>من ٦٠٤ صفحة</small><small>${ar(mem)} آية محفوظة</small></div></div>
${bad?'<div class="c w"><b>وقّف الجديد</b><p>المراجعة متراكمة أو بتنسى كتير. ركّز على القديم وقوّي الأساس الأول.</p></div>':''}
<div class=lst><button class="row pri" id=bt ${due.length?'':'disabled'}><span class=ic><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg></span><span class=tt><b>ابدأ المراجعة</b><small>${due.length?`مستحقة اليوم: ${ar(due.length)} وحدة`:'مفيش مراجعة مستحقة'}</small></span><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
<button class=row id=nw><span class=ic><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class=tt><b>حفظ جديد</b><small>${ref(a)} · ${ar(b-a+1)} آيات</small></span><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
<button class=row id=sl ${S.u.length?'':'disabled'}><span class=ic><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg></span><span class=tt><b>مراجعة قبل النوم</b><small>آخر ٣ وحدات حفظتهم</small></span><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>`);
$('#bt').onclick=()=>review(due.slice(0,12));$('#sl').onclick=()=>review(S.u.slice(-3),1);$('#nw').onclick=()=>{if(bad&&!confirm('المراجعة متراكمة. تكمل حفظ جديد برضه؟'))return;learn(a,b)}}

const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const tb=(m,i,t)=>`<div class=lt><button class=ib onclick=home() aria-label="خروج"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class=sg>${Array.from({length:m},(_,j)=>`<i class="${j<i?'d':j==i?'on':''}"></i>`).join('')}</div></div><div class=ttl>${t}</div>`,
cp=k=>`<div class=stp>${['تهيئة','استماع وقراءة','تسميع','ربط'].map((x,j)=>`<span class="${j==k?'on':''}">${x}</span>`).join('')}</div>`;
function test(items,title,onr,done,sg,pg){const go=k=>{if(k>=items.length)return done();const it=items[k];let s=10;
H(`<div class=ls>${tb(pg?pg[0]:items.length,pg?pg[1]:k,title+(pg?'':` · ${ar(k+1)}/${ar(items.length)}`))}${sg!=null?cp(sg):''}<div class=lb><p class=q>${it.lbl}</p><div class=tm id=tm>10</div><div class=ar id=ho></div><div id=rv></div></div><div class=dock id=dk><button class=g id=hb>الحرف الأول</button><button class="b go" id=rb>كشف</button></div></div>`);
$('#hb').onclick=()=>$('#ho').textContent=it.t.split(/\s+/).map(w=>w[0]).join(' ');
IV=setInterval(()=>{$('#tm').textContent=--s;$('#tm').style.setProperty('--p',s*10);if(s<=0){clearInterval(IV);$('#tm').textContent='0';$('#rb').disabled=false}},1000);
$('#rb').onclick=()=>{clearInterval(IV);['#hb','#rb','#tm'].forEach(x=>$(x).remove());$('#ho').textContent=it.t;
$('#dk').innerHTML=`<button class=b data-r=2>ممتاز</button><button class=g data-r=1>تردد</button><button class=g data-r=0>نسيت</button>`;$('#dk').classList.add('rt');$('#rv').innerHTML=`<div class=x>${it.ids.slice(0,10).map(i=>`<div>آية ${D.a[i][1]} <button class=g data-p=${i}>استمع</button><button class=g data-s=${i}>متشابه</button><button class=g data-m=${i}>معنى</button></div>`).join('')}<div><button class=g data-rec=1>سجّل صوتك</button></div><div id=xo></div></div>`;

pgus=p=>{const u=pgu(p);return u.includes('cdn.jsdelivr.net/gh/SakinaDevGroup/mushaf-madani-cdn@main')?[u,u.replace('cdn.jsdelivr.net/gh/SakinaDevGroup/mushaf-madani-cdn@main','raw.githubusercontent.com/SakinaDevGroup/mushaf-madani-cdn/main')]:[u]};
async function pgBlob(p){const key='pg:'+pgu(p);let b=await idb(key);if(!b){for(const u of pgus(p)){try{const r=await fetch(u);if(!r.ok)continue;const x=await r.blob();if(!/image/.test(x.type))continue;b=x;break}catch(e){}}if(!b)throw 0;idb(key,b).catch(()=>{})}return b}
async function dlP(){const el=$('#pp');let k=0,f=0;const w=async()=>{while(k<604){const p=++k;try{await pgBlob(p)}catch(e){f++}el.textContent=`${k}/604`+(f?` · فشل ${f}`:'')}};await Promise.all([w(),w(),w(),w()]);el.textContent=f?`خلص مع ${f} صفحة فاشلة، جرّب تاني أو راجع الرابط`:'المصحف كله اتخزّن'}
function txtPage(p,w){w.innerHTML=`<p>الصورة مش متاحة، ده نص الصفحة. راجع رابط الصور في «المزيد».</p><div class=ar>${D.a.filter(x=>x[2]==p).map(x=>x[3]+' ﴿'+x[1]+'﴾').join(' ')}</div>`}
async function mushaf(p){p=MP=Math.min(604,Math.max(1,+p||MP||D.a[S.cur][2]));const so=D.s.map((n,i)=>`<option value=${i}>${i+1}. ${n}</option>`).join('');
H(`<div class=c><div class=r><button class=g onclick=mushaf(${p-1})>السابقة</button><button class=g onclick=mushaf(${p+1})>التالية</button></div><div class=r><input id=mp type=number min=1 max=604 value=${p} onchange=mushaf(this.value)><select id=ms onchange="mushaf(D.a.find(x=>x[0]==this.value)[2])"><option>السورة…</option>${so}</select></div><div id=pgw class=pg>جارٍ التحميل…</div><small>صفحة ${p} / 604 · وردك الحالي في صفحة ${D.a[S.cur][2]}</small></div>`);
const w=$('#pgw');let x0;w.ontouchstart=e=>x0=e.touches[0].clientX;w.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70)mushaf(p+(d>0?1:-1))};
let src;try{src=URL.createObjectURL(await pgBlob(p))}catch(e){src=pgu(p)}if(MP!=p)return;w.innerHTML=`<img src="${src}" alt="صفحة ${p}">`;w.firstChild.onerror=()=>txtPage(p,w)}
const mx=()=>`<div class=c><h3>تنبيه يومي</h3><label><input type=checkbox id=no style="width:auto"> فعّل التنبيه</label><label>الوقت<input type=time id=nh></label><button class=b onclick=ntSave()>حفظ التنبيه</button><small>بيشتغل والتطبيق مفتوح أو متثبّت. الإشعار في الخلفية تمامًا محتاج خادم Push.</small></div>
<div class=c><h3>الصوت بدون إنترنت</h3><p id=ap>القارئ: ${RC[S.rec]}</p><button class=b onclick=dlA()>تحميل صوت المحفوظ + ورد اليوم</button><button class=g onclick=dlA(1)>تحميل السورة الحالية كلها</button></div>
<div class=c><h3>المصحف المصوّر</h3><label>رابط صور الصفحات<input id=pu dir=ltr onchange="S.pu=this.value.trim()||PU;save()"></label><small>{p} رقم الصفحة، {p3} بثلاث خانات، {t} فاتح/داكن حسب الجهاز.</small><p id=pp></p><button class=g onclick=dlP()>تحميل كل الصفحات للأوفلاين</button></div>`,
mi=()=>{$('#no').checked=!!S.nt.on;$('#nh').value=String(S.nt.h).padStart(2,'0')+':'+String(S.nt.m).padStart(2,'0');$('#pu').value=S.pu};
fx();ntSched();document.addEventListener('visibilitychange',()=>document.visibilityState=='visible'&&ntSched());
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b))});document.querySelector('nav button').classList.add('on');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
load();
</script></body></html>
