function ui(){const r=document.documentElement,u=S.ui;if(u.m=='d')r.dataset.m='dark';else if(u.m=='l')r.dataset.m='light';else delete r.dataset.m;if(u.p&&u.p!='b')r.dataset.p=u.p;else delete r.dataset.p;
r.style.setProperty('--qz',Math.min(160,Math.max(80,+u.z||100))/100);const tc=document.querySelector('meta[name=theme-color]'),c=PAL.find(x=>x[0]==(u.p||'b'));tc&&c&&(tc.content=c[2])}

const PN={e:'سهل',m:'متوسط',h:'صعب'},nA=n=>(+n).toLocaleString('ar-EG'),
pt=p=>{if(p.u=='a')return p.n==1?'آية':p.n==2?'آيتين':p.n<=10?nA(p.n)+' آيات':nA(p.n)+' آية';const w=Math.floor(p.n),h=p.n%1>=.5,b=w?w==1?'صفحة':w==2?'صفحتين':nA(w)+' صفحات':'';return h?(b?b+' ونصف':'نصف صفحة'):b},
pcard=()=>{const[a,b]=nextPortion(),K=$('#kd')?kst():null,eta=p=>{if(!K)return'';if(K.ro<=0)return' · ختمت المصحف';const n=K.cal(K.ss(p));return`<br>تختم بعد ${tDu(n)} تقريبًا · ${tDt(n)}`};return Object.keys(PN).map(k=>`<button class="pl${S.pl.sel==k?' on':''}" onclick="selPl('${k}')" aria-pressed="${S.pl.sel==k}"><span class=tt><b>${PN[k]}</b><small>${pt(S.pl.p[k])} في اليوم${eta(S.pl.p[k])}</small></span>${S.pl.sel==k?'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':''}</button>`).join('')+`<small>وردك القادم بالخطة دي: ${na(b-a+1)}</small>`},
pm=()=>`<div class=c><h3>الخطة</h3><p>اختار صعوبة الحفظ اليومي. كل خطة أصعب من اللي قبلها.</p><div id=pln></div></div>
<div class=c><h3>تعديل الخطط</h3><small>حدّد ورد كل خطة بالصفحات أو بالآيات. اكتب ٠٫٥ مع «صفحة» لو عايز نصف صفحة.</small>${Object.keys(PN).map(k=>`<label for=qn_${k}>${PN[k]}</label><div class=r><input id=qn_${k} type=number step=.5 min=.5 inputmode=decimal><select id=qu_${k} aria-label="وحدة خطة ${PN[k]}"><option value=p>صفحة</option><option value=a>آية</option></select></div>`).join('')}<button class=b onclick=svPl()>حفظ الخطط</button><button class=g onclick=rsPl()>الرجوع للخطط الافتراضية</button></div>`,
plFill=()=>{for(const k in PN){$('#qn_'+k).value=S.pl.p[k].n;$('#qu_'+k).value=S.pl.p[k].u}$('#pln').innerHTML=pcard();kc()};

function selPl(k){S.pl.sel=k;save();$('#pln').innerHTML=pcard();kc()}
function svPl(){const o={};for(const k in PN){const u=$('#qu_'+k).value=='a'?'a':'p';let n=parseFloat($('#qn_'+k).value);if(!(n>0))return alert('اكتب مقدار صحيح لخطة '+PN[k]);n=u=='a'?Math.max(1,Math.min(300,Math.round(n))):Math.min(20,Math.max(.5,Math.round(n*2)/2));o[k]={n,u}}S.pl.p=o;save();plFill();toast('اتحفظت الخطط')}
function rsPl(){S.pl.p=PD();save();plFill()}
const idbClr=()=>new Promise((res,rej)=>{const r=indexedDB.open('hifz',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>{const t=r.result.transaction('k','readwrite'),s=t.objectStore('k'),q=s.openKeyCursor();q.onsuccess=()=>{const c=q.result;if(c){if(c.key!='q')s.delete(c.key);c.continue()}};t.oncomplete=()=>{r.result.close();res()};t.onerror=t.onabort=()=>{r.result.close();rej(t.error)}};r.onerror=()=>rej(r.error)});
async function rst(){if(!confirm('هيتحذف كل تقدمك (الحفظ والمراجعات والإحصاءات) وكل إعداداتك، ومش هتقدر ترجّعهم.\nالأفضل تصدّر نسخة احتياطية الأول.\nتكمل؟'))return;
const f=confirm('تحذف كمان الصوت والمصحف المصوّر والتفسير اللي نزّلتهم على الجهاز؟\nموافق = احذفهم · إلغاء = سيبهم');
try{await ntTrig(0)}catch(e){}clearTimeout(NTT);au.pause();
if(f){try{await idbClr()}catch(e){}T=null}
S=DEF();fx();save();MP=0;more();toast('اتحذف كل شيء. ابدأ من جديد.')}
fx();ntSched();document.addEventListener('visibilitychange',()=>document.visibilityState=='visible'&&ntSched());
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b))});document.querySelector('nav button').classList.add('on');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
